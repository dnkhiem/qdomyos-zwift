name: "Build Android APK (Unlimited)"

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
      - unlimited-apk
    paths:
      - 'src/**'
      - '.github/workflows/android-unlimited.yml'

jobs:
  build-apk:
    name: "Build Unlimited APKs (Echelon EX-4S Android 9 & Pixel 10)"
    runs-on: ubuntu-22.04

    steps:
      - name: Xvfb install and run
        run: |
          sudo apt-get install -y xvfb
          Xvfb -ac :99 -screen 0 1280x780x24 &

      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          submodules: 'false'

      - name: Checkout submodules
        run: |
          git submodule init
          git submodule update --init --recursive

      - name: Install build packages
        run: |
          sudo apt update -y
          sudo apt-get install -y qtbase5-dev qtchooser qt5-qmake qtbase5-dev-tools qttools5-dev-tools \
            qtquickcontrols2-5-dev libqt5bluetooth5 libqt5widgets5 libqt5positioning5 libqt5xml5 \
            qtconnectivity5-dev qtpositioning5-dev libqt5charts5-dev libqt5charts5 \
            libqt5networkauth5-dev libqt5websockets5* libxcb-randr0-dev libxcb-xtest0-dev \
            libxcb-xinerama0-dev libxcb-shape0-dev libxcb-xkb-dev ccache

      - name: Install Qt Android
        uses: jdpurcell/install-qt-action@v5
        with:
          version: '5.15.0'
          host: 'linux'
          target: 'android'
          arch: 'android'
          modules: 'qtcharts qtnetworkauth qtpurchasing'
          dir: '${{ github.workspace }}/output/android/'
          cache: 'false'

      - name: Install custom 16K-page-size Qt (overlay onto stock Qt install)
        run: |
          QT_DIR="${{ github.workspace }}/output/android/Qt/5.15.0/android"
          curl -fsSL -o /tmp/qt5.15.0-android-page16.zip https://github.com/cagnulein/qt-5.15.0-android-page16k/releases/download/1.0.0/qt5.15.0-android-page16.zip
          unzip -q /tmp/qt5.15.0-android-page16.zip -d /tmp/qt-page16k
          rsync -a --exclude='bin/' "/tmp/qt-page16k/qt5.15.0-android-page16/usr/local/Qt-5.15.0/" "$QT_DIR/"
          sed -i 's/darwin-x86_64/linux-x86_64/' "$QT_DIR/mkspecs/qdevice.pri"
          rm -rf /tmp/qt5.15.0-android-page16.zip /tmp/qt-page16k

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Patch Qt for bluetooth
        run: cp qt-patches/android/5.15.0/jar/*.* ${{ github.workspace }}/output/android/Qt/5.15.0/android/jar/

      - name: Download 3rd party files for qthttpserver
        run: cp qHttpServerBin/5.15.2/headers/* src/qthttpserver/src/3rdparty/http-parser/

      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: /usr/local/lib/android/sdk/ndk/21.1.6352462
          key: android-ndk-21.1.6352462-${{ runner.os }}

      - name: Install Android SDK packages
        run: |
          SDKMANAGER="/usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager"
          echo "y" | $SDKMANAGER "ndk;21.1.6352462" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup NDK environment
        run: |
          NDK_PATH=/usr/local/lib/android/sdk/ndk/21.1.6352462
          ln -sfn $NDK_PATH /usr/local/lib/android/sdk/ndk-bundle
          rm -rf /usr/local/lib/android/sdk/ndk/25.1.8937393
          echo "ANDROID_NDK=/usr/local/lib/android/sdk/ndk-bundle" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk-bundle" >> $GITHUB_ENV

      - name: Generate clean secrets (without LICENSE definition)
        run: |
          cd src
          touch secret.h
          echo '#define STRAVA_SECRET_KEY ""' >> secret.h
          echo '#define PELOTON_SECRET_KEY ""' >> secret.h
          echo '#define SMTP_USERNAME ""' >> secret.h
          echo '#define SMTP_PASSWORD ""' >> secret.h
          echo '#define SMTP_SERVER ""' >> secret.h
          echo '#define INTERVALSICU_CLIENT_ID ""' >> secret.h
          echo '#define INTERVALSICU_CLIENT_SECRET ""' >> secret.h
          touch inner_templates/googlemaps/cesium-key.js

      - name: Build qthttpserver for Android
        run: |
          cd src/qthttpserver
          qmake
          make -j$(nproc)
          make install

      - name: "Build QZ for Android (armeabi-v7a for EX-4S Android 9, arm64-v8a for Pixel 10)"
        run: |
          lrelease src/qdomyos-zwift.pri
          # Chỉ build 2 kiến trúc máy thật (armeabi-v7a và arm64-v8a), bỏ x86/x86_64
          qmake -spec android-clang 'ANDROID_ABIS=armeabi-v7a arm64-v8a' 'ANDROID_NDK_ROOT=/usr/local/lib/android/sdk/ndk/21.1.6352462' 'CONFIG+=debug'
          make qmake_all
          for abi in armeabi-v7a arm64-v8a; do
            make -j$(nproc) -C src -f Makefile.qdomyos-zwift "$abi-all"
          done
          make -j$(nproc) && make INSTALL_ROOT=${{ github.workspace }}/output/android/ install

      - name: Strip debug symbols to reduce APK size
        run: |
          STRIP_TOOL="/usr/local/lib/android/sdk/ndk/21.1.6352462/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip"
          echo "Stripping debug symbols from shared libraries..."
          find ${{ github.workspace }}/output/android/libs/ -name "*.so" -exec $STRIP_TOOL --strip-unneeded {} +
          echo "Strip completed. Library sizes:"
          ls -lh ${{ github.workspace }}/output/android/libs/*/*.so

      - name: Assemble Separate Android APKs with Gradle
        run: |
          cd src
          mkdir -p ${{ github.workspace }}/output/android
          rsync -a --exclude build --exclude .gradle android/ ${{ github.workspace }}/output/android/

          # Bật cấu hình tách file APK riêng biệt cho từng ABI
          sed -i '/android {/a \    splits {\n        abi {\n            enable true\n            reset()\n            include "armeabi-v7a", "arm64-v8a"\n            universalApk false\n        }\n    }' ${{ github.workspace }}/output/android/build.gradle

          androiddeployqt --input android-qdomyos-zwift-deployment-settings.json --output ${{ github.workspace }}/output/android/ --android-platform android-35 --gradle --aux-mode
          export GRADLE_USER_HOME="${{ github.workspace }}/.gradle-android"
          export GRADLE_OPTS="-Dgradle.user.home=$GRADLE_USER_HOME"
          export GRADLE_DIST_DIR="${{ github.workspace }}/gradle-8.13"
          export QT_ANDROID_DIR="${{ github.workspace }}/output/android/Qt/5.15.0/android"
          mkdir -p "$GRADLE_USER_HOME"
          rm -f "$GRADLE_USER_HOME/gradle.properties"
          rm -f "$HOME/.gradle/gradle.properties"
          find ${{ github.workspace }}/output/android \( -name '*.properties' -o -name '*.gradle' -o -name '*.gradle.kts' \) -exec sed -i '/android\.bundle\.enableUncompressedNativeLibs/d' {} +
          printf '\nqt5AndroidDir=%s/src/android/java\n' "$QT_ANDROID_DIR" >> ${{ github.workspace }}/output/android/gradle.properties
          if [ ! -x "$GRADLE_DIST_DIR/bin/gradle" ]; then
            curl -fsSL https://services.gradle.org/distributions/gradle-8.13-bin.zip -o /tmp/gradle-8.13-bin.zip
            unzip -q /tmp/gradle-8.13-bin.zip -d ${{ github.workspace }}
          fi
          "$GRADLE_DIST_DIR/bin/gradle" -g "$GRADLE_USER_HOME" --no-daemon -p ${{ github.workspace }}/output/android assembleDebug

          echo "Generated APK files in output directory:"
          find ${{ github.workspace }}/output/android/build/outputs/apk/debug/ -type f -name "*.apk" -exec ls -lh {} +

          mkdir -p ${{ github.workspace }}/dist_apks
          # Đổi tên và chuẩn bị 2 file APK rõ ràng
          cp $(find ${{ github.workspace }}/output/android/build/outputs/apk/debug/ -name "*armeabi-v7a*.apk" | head -n 1) ${{ github.workspace }}/dist_apks/qz-echelon-ex4s-android9.apk
          cp $(find ${{ github.workspace }}/output/android/build/outputs/apk/debug/ -name "*arm64-v8a*.apk" | head -n 1) ${{ github.workspace }}/dist_apks/qz-pixel10-arm64.apk

          echo "Final separate APKs:"
          ls -lh ${{ github.workspace }}/dist_apks/

      - name: Upload Echelon EX-4S Android 9 APK
        uses: actions/upload-artifact@v4
        with:
          name: QZ-Echelon-EX4S-Android9-APK
          path: ${{ github.workspace }}/dist_apks/qz-echelon-ex4s-android9.apk

      - name: Upload Pixel 10 ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: QZ-Pixel10-ARM64-APK
          path: ${{ github.workspace }}/dist_apks/qz-pixel10-arm64.apk
